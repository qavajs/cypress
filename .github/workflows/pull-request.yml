name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: unit tests
        run: npm run test:unit
      - name: type check
        run: npm run typecheck
      - name: package content
        run: npm pack --dry-run

  e2e:
    needs: unit
    strategy:
      matrix:
        version: [ 22, 24, 26 ]
        mode: [ describe, it ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
      - run: npm ci
      - name: e2e (${{ matrix.mode }} mode)
        run: npm run test
        env:
          MODE: ${{ matrix.mode }}
